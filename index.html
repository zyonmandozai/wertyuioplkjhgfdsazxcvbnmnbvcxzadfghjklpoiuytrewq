<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="arcade-frame" src=""></iframe>

    <script>
        // Your live raw Gist URL link
        const gistUrl = "https://gist.githubusercontent.com/zyonmandozai/f3bcae93c6ba3256293800d54e7fff64/raw";

        async function fetchTunnelLink() {
            try {
                const response = await fetch(gistUrl);
                const tunnelUrl = await response.text();
                document.getElementById('arcade-frame').src = tunnelUrl.trim();
            } catch (error) {
                console.error(error);
            }
        }

        fetchTunnelLink();
    </script>
</body>
</html>
