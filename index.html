<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="arcade-frame" src=""></iframe>

    <script>
        // Using JSONP callback to completely smash through the browser's CORS block
        const gistId = "f3bcae93c6ba3256293800d54e7fff64";
        const script = document.createElement('script');
        
        script.src = `https://api.allorigins.win/get?url=${encodeURIComponent('https://gist.githubusercontent.com/zyonmandozai/' + gistId + '/raw')}&callback=handleTunnel`;
        document.body.appendChild(script);

        function handleTunnel(data) {
            try {
                // Grab the clean link out of the wrapper, trim any sneaky spaces, and inject it
                const tunnelUrl = data.contents.trim();
                document.getElementById('arcade-frame').src = tunnelUrl;
            } catch (error) {
                console.error("Error setting iframe source:", error);
            }
        }
    </script>
</body>
</html>
