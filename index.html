<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="arcade-frame" src=""></iframe>

    <script>
        // Added a public CORS proxy helper right before your raw Gist URL
        const gistUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://gist.githubusercontent.com/zyonmandozai/f3bcae93c6ba3256293800d54e7fff64/raw");

        async function fetchTunnelLink() {
            try {
                const response = await fetch(gistUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const tunnelUrl = await response.text();
                
                // Set the iframe source to your live tunnel link
                document.getElementById('arcade-frame').src = tunnelUrl.trim();
            } catch (error) {
                console.error("Error fetching tunnel link:", error);
            }
        }

        fetchTunnelLink();
    </script>
</body>
</html>
